name: TRT Bil Bakalim Bot - APK Derle

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Debug APK Derle
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Indir (Checkout)
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Proje Dizinini Duzenle ve Gradle Calistirma Izni Ver
        run: |
          # Eger proje SoruArsivi alt klasorunde pushlandiysa:
          if [ -d "SoruArsivi" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Proje SoruArsivi alt klasorunde tespit edildi, kok dizine kopyalaniyor..."
            # .github cakismasini onlemek icin cp -rf kullan ve SoruArsivi klasorunu temizle
            cp -rf SoruArsivi/* . 2>/dev/null || true
            if [ -d "SoruArsivi/.github" ]; then
              cp -rf SoruArsivi/.github/* .github/ 2>/dev/null || true
            fi
            rm -rf SoruArsivi
          fi

          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: APK Derle (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: APK Dosyasini Artifact Olarak Yukle
        uses: actions/upload-artifact@v4
        with:
          name: SoruArsivi-Bot-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
