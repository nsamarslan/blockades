# APK imza anahtarinin bilgileri.
#
# Bunlar gizli degil, bilerek depoda duruyor: Android bir uygulamanin ustune
# ancak AYNI anahtarla imzalanmis bir APK'yi kurdurur. Varsayilan debug
# anahtari her makinede ayri uretildigi ve GitHub Actions her calismada
# sifirdan bir sanal makine actigi icin, sabit bir anahtar olmadan her
# derleme farkli imzalaniyor ve hicbir guncelleme kurulamiyordu.
#
# Depo ozel (private) oldugu icin anahtari yalnizca depoya erisimi olanlar
# gorur. Kendi anahtarini kullanmak istersen:
#
#   keytool -genkeypair -v -keystore keystore/soruarsivi.jks \
#     -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10950 \
#     -alias soruarsivi -storepass <parola> -keypass <parola> \
#     -dname "CN=Soru Arsivi, O=Soru Arsivi, C=TR"
#
# ...ve asagidaki parolalari guncelle. Anahtar degisirse telefondaki mevcut
# kurulumun bir kez silinmek zorunda kalir; oncesinde Ayarlar > Yedekleme'den
# arsivini disa aktar.
#
# Bu dosya yoksa derleme varsayilan debug anahtarina duser ve uyari basar.

storeFile=keystore/soruarsivi.jks
storePassword=soruarsivi
keyAlias=soruarsivi
keyPassword=soruarsivi
